<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Projects</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        h1, h2, h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        /* Container Styles */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Projects Grid */
        .projectsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Project Card Styles */
        .projectCard {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .projectCard:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .cardImage {
            height: 200px;
            overflow: hidden;
        }

        .cardImage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .projectCard:hover .cardImage img {
            transform: scale(1.05);
        }

        .cardContent {
            padding: 20px;
        }

        .cardTitle {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .cardDescription {
            color: #7f8c8d;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .cardMeta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        .cardCategory {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cardDate {
            color: #7f8c8d;
        }

        .featuredTag {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #ff6b6b;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 1;
        }

        /* Modal Styles */
        .modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modalOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modalContent {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modalOverlay.active .modalContent {
            transform: translateY(0);
        }

        .closeModal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
            background: none;
            border: none;
        }

        .closeModal:hover {
            color: #e74c3c;
        }

        .modalHeader {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .modalTitle {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .modalSubtitle {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .modalBody {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .modalGallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .modalMainImage {
            height: 300px;
            overflow: hidden;
            border-radius: 8px;
        }

        .modalMainImage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modalThumbnails {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .modalThumbnail {
            height: 80px;
            overflow: hidden;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .modalThumbnail:hover, .modalThumbnail.active {
            opacity: 1;
        }

        .modalThumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modalDetails {
            padding-right: 15px;
        }

        .modalDescription {
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .modalMeta {
            margin-bottom: 20px;
        }

        .metaItem {
            margin-bottom: 10px;
            display: flex;
        }

        .metaLabel {
            font-weight: 600;
            width: 120px;
            color: #2c3e50;
        }

        .metaValue {
            flex: 1;
        }

        .modalTags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .modalTag {
            background-color: #f1f2f6;
            color: #2c3e50;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .modalTestimonial {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .testimonialQuote {
            font-style: italic;
            margin-bottom: 10px;
        }

        .testimonialAuthor {
            font-weight: 600;
        }

        .testimonialPosition {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .modalResults {
            margin-top: 30px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .resultsTitle {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .resultsList {
            list-style-type: disc;
            padding-left: 20px;
        }

        .resultsList li {
            margin-bottom: 5px;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .modalBody {
                grid-template-columns: 1fr;
            }

            .modalDetails {
                padding-right: 0;
            }

            .projectsGrid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .projectsGrid {
                grid-template-columns: 1fr;
            }

            .modalContent {
                padding: 20px;
            }
        }
    </style>
</head>

            // Function to create project cards
            function createProjectCards() {
                const projectsGrid = $('#projects-grid');
                projectsGrid.empty();

                portfolioData.portfolio.projects.forEach(project => {
                    // Find category details
                    const category = portfolioData.categories.find(cat => cat.id === project.category);
                    
                    // Create card HTML
                    const cardHtml = `
                        <div class="projectCard" data-project-id="${project.id}">
                            ${project.featured ? '<span class="featuredTag">Featured</span>' : ''}
                            <div class="cardImage">
                                <img src="${project.thumbnailImage}" alt="${project.projectTitle}">
                            </div>
                            <div class="cardContent">
                                <h3 class="cardTitle">${project.projectTitle}</h3>
                                <p class="cardDescription">${project.shortDescription}</p>
                                <div class="cardMeta">
                                    <span class="cardCategory" style="background-color: ${category.color}20; color: ${category.color}">
                                        ${category.name}
                                    </span>
                                    <span class="cardDate">${project.projectDate}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    projectsGrid.append(cardHtml);
                });

                // Add click event to cards
                $('.projectCard').on('click', function() {
                    const projectId = $(this).data('project-id');
                    openProjectModal(projectId);
                });
            }

            // Function to open project modal
            function openProjectModal(projectId) {
                const project = portfolioData.portfolio.projects.find(p => p.id === projectId);
                const category = portfolioData.categories.find(cat => cat.id === project.category);

                // Set basic info
                $('#modal-title').text(project.projectTitle);
                $('#modal-subtitle').text(project.shortDescription);
                $('#modal-description').html(`<p>${project.fullDescription}</p>
                    ${project.challenges ? `<h3>Challenges</h3><p>${project.challenges}</p>` : ''}
                    ${project.solution ? `<h3>Solution</h3><p>${project.solution}</p>` : ''}`);
                
                // Set meta info
                $('#modal-client').text(project.clientName);
                $('#modal-date').text(project.projectDate);
                $('#modal-duration').text(project.duration);
                $('#modal-tools').text(project.tools.join(', '));
                $('#modal-website').html(project.projectUrl ? `<a href="${project.projectUrl}" target="_blank">Visit Website</a>` : 'N/A');
                
                // Set tags
                const tagsContainer = $('#modal-tags');
                tagsContainer.empty();
                project.tags.forEach(tag => {
                    tagsContainer.append(`<span class="modalTag">${tag}</span>`);
                });

                // Set testimonial
                const testimonialContainer = $('#modal-testimonial');
                if (project.testimonial) {
                    testimonialContainer.html(`
                        <div class="testimonialQuote">"${project.testimonial.quote}"</div>
                        <div class="testimonialAuthor">${project.testimonial.author}</div>
                        <div class="testimonialPosition">${project.testimonial.position}</div>
                    `);
                } else {
                    testimonialContainer.html('<p>No testimonial available</p>');
                }

                // Set results
                const resultsContainer = $('#modal-results');
                resultsContainer.html(`<p>${project.results}</p>`);

                // Set images
                const mainImageContainer = $('#modal-main-image');
                const thumbnailsContainer = $('#modal-thumbnails');
                
                mainImageContainer.empty();
                thumbnailsContainer.empty();
                
                if (project.projectImages.length > 0) {
                    // Set main image to first image
                    mainImageContainer.html(`<img src="${project.projectImages[0]}" alt="${project.projectTitle}">`);
                    
                    // Create thumbnails
                    project.projectImages.forEach((image, index) => {
                        const thumbnail = $(`<div class="modalThumbnail ${index === 0 ? 'active' : ''}">
                            <img src="${image}" alt="Thumbnail ${index + 1}">
                        </div>`);
                        
                        thumbnail.on('click', function() {
                            // Update main image
                            mainImageContainer.html(`<img src="${image}" alt="${project.projectTitle}">`);
                            
                            // Update active thumbnail
                            $('.modalThumbnail').removeClass('active');
                            $(this).addClass('active');
                        });
                        
                        thumbnailsContainer.append(thumbnail);
                    });
                } else {
                    mainImageContainer.html('<p>No images available</p>');
                }

                // Show modal
                $('#project-modal').addClass('active');
                $('body').css('overflow', 'hidden');
            }

            // Close modal
            $('#close-modal').on('click', function() {
                $('#project-modal').removeClass('active');
                $('body').css('overflow', 'auto');
            });

            // Close modal when clicking outside content
            $('#project-modal').on('click', function(e) {
                if ($(e.target).hasClass('modalOverlay')) {
                    $('#project-modal').removeClass('active');
                    $('body').css('overflow', 'auto');
                }
            });

            // Initialize the page
            createProjectCards();
        });
    </script>
</body>
</html>
